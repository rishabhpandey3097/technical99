<div class="card mob-menu flex justify-content-between align-items-center px-2 md:px-3 sticky bottom-0 left-0 w-full z-3 block lg:hidden">
    <span class="text-center pt-2 pb-1 cursor-pointer">
        <i class="pi pi-home" style="font-size: 1.5rem"></i>
        <p class="mt-1 mb-0">Home</p>
    </span>
    <span class="text-center pt-2 pb-1 cursor-pointer">
        <i class="pi pi-graduation-cap" style="font-size: 1.5rem"></i>
        <p class="mt-1 mb-0">Training</p>
    </span>
    <span class="text-center pt-2 pb-1 cursor-pointer">
        <i class="pi pi-phone" style="font-size: 1.5rem"></i>
        <p class="mt-1 mb-0">Enquiry</p>
    </span>
    <span class="text-center pt-2 pb-1 cursor-pointer">
        <i class="pi pi-pen-to-square" style="font-size: 1.5rem"></i>
        <p class="mt-1 mb-0">Assessment</p>
    </span>
    <span class="text-center pt-2 pb-1 cursor-pointer more-btn">
        <p-menu #menu [model]="items" [popup]="true" />
        <p-button (onClick)="menu.toggle($event)" icon="pi pi-bars" [style]="{'background': 'none', 'border': 'none', 'color':'#000', 'font-size':'1.5rem', 'padding':'0'}"/>
        <p class="mt-1 mb-0">
            More
        </p>
    </span>
</div>
