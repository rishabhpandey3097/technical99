<div
    class="card mob-menu flex justify-content-between align-items-center px-4 md:px-5 sticky bottom-0 left-0 w-full z-3 block lg:hidden">
    <span class="text-center pt-2 pb-1 cursor-pointer">
        <i class="pi pi-home text-lg"></i>
        <p class="mt-1 mb-0 text-xs">Home</p>
    </span>
    <span class="text-center pt-2 pb-1 cursor-pointer">
        <i class="pi pi-graduation-cap text-lg"></i>
        <p class="mt-1 mb-0 text-xs">Training</p>
    </span>
    <span class="text-center pt-2 pb-1 cursor-pointer">
        <i class="pi pi-phone text-lg"></i>
        <p class="mt-1 mb-0 text-xs">Enquiry</p>
    </span>
    <span class="text-center pt-2 pb-1 cursor-pointer">
        <i class="pi pi-pen-to-square text-lg"></i>
        <p class="mt-1 mb-0 text-xs">Assessment</p>
    </span>
    <span class="text-center pt-2 pb-1 cursor-pointer more-btn">
        <p-menu #menu [model]="items" [popup]="true" />
        <p-button styleClass="text-lg" (onClick)="menu.toggle($event)" icon="pi pi-bars"
            [style]="{'background': 'none', 'border': 'none', 'color':'#000', 'padding':'0'}" />
        <p class="mt-1 mb-0 text-xs">
            More
        </p>
    </span>
</div>
